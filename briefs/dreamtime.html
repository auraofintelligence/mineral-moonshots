<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dreamtime Threshold | Mineral Moonshots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body data-page="dreamtime">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" data-site-header></header>
    <main id="main">
      <section class="page-hero" data-page-hero>
        <p class="eyebrow" data-eyebrow></p>
        <h1 data-title></h1>
        <p class="page-lede" data-deck></p>
        <p class="source-line" data-source></p>
      </section>
      <section class="section two-col">
        <article class="source-panel">
          <p class="eyebrow">Brief</p>
          <h2>What this page is saying</h2>
          <ul class="brief-points" data-brief-points></ul>
        </article>
        <article class="moonshot-panel">
          <p class="eyebrow">Moonshot edge</p>
          <h2>Science fiction pressure test</h2>
          <p data-moonshot></p>
        </article>
      </section>
      <section class="section">
        <div class="section-heading">
          <p class="eyebrow">Modules</p>
          <h2>Pieces worth prototyping</h2>
        </div>
        <div class="module-grid" data-modules></div>
      </section>
      <section class="section wide visual-band">
        <div class="section-heading">
          <p class="eyebrow">Experiments</p>
          <h2>Make it tangible without overclaiming it</h2>
        </div>
        <ul class="experiment-list" data-experiments></ul>
      </section>
      <section class="section">
        <div class="section-heading">
          <p class="eyebrow">Element notes</p>
          <h2>Material palette for this concept</h2>
        </div>
        <div class="element-grid" data-page-elements></div>
        <div class="more-briefs" data-more-briefs></div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../site-data.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
